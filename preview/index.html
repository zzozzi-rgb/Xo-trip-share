<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XO Trip · 일정</title>
<meta name="description" content="링크 하나로 여는 여행 일정. 함께 보는 사람과 좋아요·메모를 나눕니다.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F8F3EA">
<meta property="og:title" content="XO Trip · 일정">
<meta property="og:description" content="링크 하나로 여행 일정을 함께 봅니다.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F8F3EA'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='27' font-weight='700' fill='%231B1A17' text-anchor='middle'%3EXO%3C/text%3E%3Ccircle cx='32' cy='52' r='2.6' fill='%23C0562F'/%3E%3C/svg%3E">
<style>
  :root{
    --paper:#F8F3EA;
    --paper-2:#FCF9F3;
    --card:#FFFDFA;
    --ink:#1B1A17;
    --ink-2:rgba(27,26,23,.66);
    --ink-3:rgba(27,26,23,.44);
    --line:rgba(27,26,23,.11);
    --line-2:rgba(27,26,23,.19);
    --accent:#C0562F;
    --accent-2:#F3DFD3;
    --ok:#3E6B4A;
    --serif:Georgia,"Times New Roman","Nanum Myeongjo","Noto Serif KR",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,"D2Coding",monospace;
    --pad:16px;
    --max:1160px;
    --top:54px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{
    margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(rgba(27,26,23,.02) 1px,transparent 1px);
    background-size:3px 3px;
  }
  body.sheet-open{overflow:hidden}
  ::selection{background:var(--accent-2);color:var(--ink)}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  a{color:inherit;text-decoration:none}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .app{max-width:var(--max);margin:0 auto;padding:0 var(--pad) 108px}

  /* ── top bar ─────────────────────────────── */
  .topbar{
    position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;height:var(--top);
    margin:0 calc(var(--pad) * -1);padding:0 var(--pad);
    background:rgba(248,243,234,.86);backdrop-filter:blur(14px) saturate(1.15);
    border-bottom:1px solid transparent;transition:border-color .2s ease;
  }
  .topbar.scrolled{border-bottom-color:var(--line)}
  .brand{display:flex;align-items:center;gap:7px;font-family:var(--serif);font-size:12px;letter-spacing:.2em;color:var(--ink-2)}
  .brand b{color:var(--ink);letter-spacing:.22em}
  .brand i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:block}
  .brand span{font-size:9.5px;letter-spacing:.18em;color:var(--ink-3)}
  .topacts{margin-left:auto;display:flex;gap:7px}
  .iconbtn{
    width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line-2);
    border-radius:11px;background:var(--card);color:var(--ink);
    transition:background .16s ease,border-color .16s ease,transform .16s ease;
  }
  .iconbtn:hover{background:#fff;border-color:var(--ink-3)}
  .iconbtn:active{transform:scale(.96)}
  .iconbtn svg{width:17px;height:17px}
  .iconbtn.solid{background:var(--ink);border-color:var(--ink);color:var(--paper-2)}
  .iconbtn.solid:hover{background:#000}
  .iconbtn.quiet{background:transparent;border-color:var(--line-2);color:var(--ink-2)}

  /* ── hero ────────────────────────────────── */
  .side{padding-top:6px}
  .hero{padding:20px 0 6px}
  .kicker{
    display:flex;align-items:center;gap:6px;margin:0 0 9px;
    font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
  }
  .kicker::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.85}
  h1#tripTitle{
    font-family:var(--serif);font-weight:700;font-size:clamp(27px,7.4vw,40px);
    line-height:1.12;letter-spacing:-.022em;margin:0 0 10px;word-break:keep-all;overflow-wrap:anywhere;
  }
  .dateline{display:flex;flex-wrap:wrap;gap:5px 14px;margin:0;font-size:13px;color:var(--ink-2);letter-spacing:.005em}
  .dateline .mi{display:inline-flex;align-items:center;gap:5px;min-width:0}
  .dateline svg{width:14px;height:14px;flex:none;color:var(--ink-3)}
  .stayline{display:flex;align-items:center;gap:6px;margin:9px 0 0;font-size:12.5px;color:var(--ink-3);word-break:keep-all}
  .stayline svg{width:14px;height:14px;flex:none}
  .statline{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .schip{font-size:11.5px;padding:4px 10px;border-radius:999px;background:rgba(27,26,23,.055);color:var(--ink-2);letter-spacing:.01em}
  .schip b{color:var(--ink);font-weight:650;margin-left:4px}

  /* name pill */
  .nickrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:15px}
  .namepill{
    display:inline-flex;align-items:center;gap:7px;padding:4px 11px 4px 5px;
    border:1px solid var(--line-2);border-radius:999px;background:var(--card);cursor:text;
    transition:border-color .16s ease;
  }
  .namepill:focus-within{border-color:var(--accent)}
  .namepill .av{
    width:23px;height:23px;border-radius:50%;background:var(--accent);color:#fff;
    display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:none;
  }
  .namepill .nlabel{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);flex:none}
  .namepill input{
    width:88px;min-width:44px;border:0;background:transparent;padding:0;font:inherit;
    font-size:13px;font-weight:600;color:var(--ink);
  }
  .namepill input::placeholder{color:var(--ink-3);font-weight:500}
  .namepill .pen{width:12px;height:12px;color:var(--ink-3);flex:none}
  .nickhint{font-size:11px;color:var(--accent);letter-spacing:.01em}

  /* notice */
  .notice{
    display:flex;align-items:center;gap:9px;margin-top:14px;padding:10px 12px;
    border:1px solid var(--line);border-radius:11px;background:var(--paper-2);
    font-size:12.5px;color:var(--ink-2);line-height:1.45;
  }
  .notice b{color:var(--ink);font-weight:650}
  .notice .btn{margin-left:auto;flex:none}
  .notice.err{border-color:rgba(192,86,47,.4);background:#FBECE4;color:#7A3218}
  .notice .ex{width:17px;height:17px;flex:none;display:grid;place-items:center;border-radius:50%;background:rgba(122,50,24,.12);font-size:11px;font-weight:700}

  /* ── day chips ───────────────────────────── */
  .daytabs{
    display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
    position:sticky;top:var(--top);z-index:40;margin:16px -4px 2px;padding:9px 4px 11px;
    background:linear-gradient(var(--paper) 72%,rgba(248,243,234,0));
  }
  .daytabs::-webkit-scrollbar{display:none}
  .daytab{
    flex:0 0 auto;display:flex;align-items:baseline;gap:6px;white-space:nowrap;
    padding:7px 13px;border-radius:999px;border:1px solid var(--line-2);
    background:var(--card);font-size:12px;color:var(--ink-2);
    transition:background .16s ease,color .16s ease,border-color .16s ease;
  }
  .daytab b{font-weight:650;font-size:12.5px}
  .daytab span{font-size:11px;color:var(--ink-3)}
  .daytab .dv{display:none;font-style:normal;font-size:10.5px;color:inherit;opacity:.55;margin-left:2px}
  .daytab:hover{border-color:var(--ink-3)}
  .daytab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .daytab[aria-selected="true"] span{color:rgba(255,255,255,.62)}

  /* ── day head ────────────────────────────── */
  .dayhead{display:flex;align-items:flex-end;gap:13px;padding:18px 2px 11px;border-bottom:1px solid var(--line-2)}
  .dnum{display:flex;flex-direction:column;line-height:1;flex:none;padding-bottom:2px}
  .dnum span{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .dnum b{font-family:var(--serif);font-size:29px;letter-spacing:-.03em;line-height:1.05;color:var(--ink)}
  .dinfo{min-width:0;padding-bottom:1px}
  .dinfo h2{font-family:var(--serif);font-size:18px;font-weight:700;margin:0 0 3px;line-height:1.25;letter-spacing:-.012em;word-break:keep-all}
  .dinfo p{margin:0;font-size:11.5px;color:var(--ink-3);letter-spacing:.03em}
  .daysummary{
    margin:10px 2px 15px;font-size:12.5px;line-height:1.6;color:var(--ink-2);word-break:keep-all;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }

  /* ── timeline ────────────────────────────── */
  .timeline{list-style:none;margin:0;padding:0}
  .stop{display:grid;grid-template-columns:48px minmax(0,1fr)}
  .rail{position:relative;padding-top:15px}
  .rail .t{display:block;padding-right:17px;text-align:right;font-size:11.5px;font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
  .rail .t.muted{color:var(--ink-3);font-weight:500}
  .rail::before{content:"";position:absolute;right:11px;top:0;bottom:0;width:1px;background:var(--line-2);opacity:.75}
  .stop:first-child .rail::before{top:21px}
  .stop:last-child .rail::before{bottom:auto;height:27px}
  .rail .dot{
    position:absolute;right:7px;top:20px;width:9px;height:9px;border-radius:50%;
    background:var(--c,var(--accent));box-shadow:0 0 0 3px var(--paper);
  }

  .card{
    margin:6px 0 7px 10px;padding:12px 13px 11px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 1px 2px rgba(27,26,23,.035);
    transition:box-shadow .18s ease,border-color .18s ease;
  }
  @media (hover:hover){.card:hover{box-shadow:0 3px 14px rgba(27,26,23,.06);border-color:var(--line-2)}}
  .crow{display:flex;align-items:center;gap:7px;margin-bottom:6px;min-width:0}
  .tag{
    display:inline-flex;align-items:center;gap:4px;flex:none;
    padding:3px 7px;border-radius:6px;background:var(--ct);
    font-size:10.5px;font-weight:700;letter-spacing:.02em;color:var(--c);
  }
  .tag svg{width:12px;height:12px}
  .badges{display:flex;align-items:center;gap:5px;margin-left:auto;min-width:0;overflow:hidden}
  .badge{
    font-size:9.5px;letter-spacing:.04em;font-weight:650;border-radius:5px;
    padding:2px 6px;white-space:nowrap;border:1px solid transparent;
  }
  .badge.positive{color:var(--ok);border-color:rgba(62,107,74,.32);background:rgba(62,107,74,.07)}
  .badge.info{color:#2F5C74;border-color:rgba(47,92,116,.3);background:rgba(47,92,116,.06)}
  .badge.alert{color:#9B2C2C;border-color:rgba(155,44,44,.3);background:rgba(155,44,44,.06)}
  .badge.warn{color:#8A5A12;border-color:rgba(138,90,18,.3);background:rgba(138,90,18,.07)}
  .badge.muted{color:var(--ink-3);border-color:var(--line)}
  .badge.together{color:var(--ink-2);border-style:dashed;border-color:var(--line-2);background:transparent}

  .card .title{
    margin:0;font-size:15px;font-weight:650;line-height:1.4;letter-spacing:-.008em;
    word-break:keep-all;overflow-wrap:anywhere;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .meta{display:flex;align-items:center;gap:5px;margin:5px 0 0;font-size:12px;color:var(--ink-3);min-width:0}
  .meta svg{width:13px;height:13px;flex:none}
  .meta .mtxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

  .note{display:flex;align-items:flex-start;gap:5px;margin:7px 0 0;font-size:12px;line-height:1.5;color:var(--ink-2)}
  .note .txt{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
  .note.open .txt{display:block;-webkit-line-clamp:unset;overflow:visible}
  .notemore{flex:none;width:17px;height:17px;display:grid;place-items:center;color:var(--ink-3);margin-top:1px;border-radius:5px}
  .notemore svg{width:13px;height:13px;transition:transform .18s ease}
  .notemore[aria-expanded="true"] svg{transform:rotate(180deg)}

  .acts{display:flex;align-items:center;gap:6px;margin-top:10px}
  .pill{
    display:inline-flex;align-items:center;gap:4px;height:29px;padding:0 10px;
    border-radius:999px;border:1px solid var(--line-2);background:transparent;
    font-size:12px;color:var(--ink-2);transition:background .15s ease,border-color .15s ease,color .15s ease;
  }
  .pill:hover{border-color:var(--ink-3);color:var(--ink)}
  .pill .emo{font-size:13px;line-height:1;filter:grayscale(1);opacity:.72;transition:filter .15s,opacity .15s}
  .pill .n{font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums}
  .pill svg{width:14px;height:14px}
  .pill.on{border-color:rgba(192,86,47,.42);background:var(--accent-2);color:var(--accent)}
  .pill.on .emo{filter:none;opacity:1}
  .pill.on svg{color:var(--accent)}
  .pill.like[aria-pressed="true"]{border-color:rgba(192,86,47,.42);background:var(--accent-2);color:var(--accent)}
  .pill.like[aria-pressed="true"] .emo{filter:none;opacity:1}
  .cost{margin-left:3px;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;letter-spacing:.01em;white-space:nowrap}
  .mapbtn{
    margin-left:auto;flex:none;width:30px;height:30px;border-radius:9px;
    display:grid;place-items:center;border:1px solid var(--line);
    background:var(--paper-2);color:var(--ink-2);transition:background .15s,border-color .15s,color .15s;
  }
  .mapbtn:hover{background:#fff;border-color:var(--ink-3);color:var(--ink)}
  .mapbtn svg{width:15px;height:15px}

  .peers{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line-2);display:flex;flex-direction:column;gap:7px}
  .pm{display:flex;align-items:flex-start;gap:7px;font-size:12px;line-height:1.45;color:var(--ink-2)}
  .pav{
    flex:none;width:20px;height:20px;border-radius:50%;background:rgba(27,26,23,.075);
    display:grid;place-items:center;font-size:9px;font-weight:700;color:var(--ink-2);margin-top:1px;
  }
  .pm .ptxt{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
  .pm b{font-weight:650;color:var(--ink-3);font-size:11px;margin-right:5px}
  .pm.self .pav{background:var(--accent-2);color:var(--accent)}
  .pm.self .ptxt{color:var(--ink)}

  .memoedit{display:flex;gap:6px;margin-top:9px}
  .memoedit input{
    flex:1;min-width:0;height:34px;border:1px solid var(--line-2);border-radius:9px;
    background:var(--paper-2);padding:0 10px;font:inherit;font-size:12.5px;color:var(--ink);
  }
  .memoedit input::placeholder{color:var(--ink-3)}
  .memoedit .send{width:34px;height:34px;flex:none;border-radius:9px;background:var(--ink);color:var(--paper-2);display:grid;place-items:center}
  .memoedit .send svg{width:15px;height:15px}

  .daynav{display:flex;gap:8px;margin-top:18px}
  .daynav a,.daynav button{
    flex:1;display:flex;align-items:center;gap:7px;padding:11px 12px;min-width:0;
    border:1px solid var(--line);border-radius:11px;background:var(--card);
    font-size:12px;color:var(--ink-2);transition:border-color .15s,background .15s;
  }
  .daynav button:hover{border-color:var(--ink-3);background:#fff}
  .daynav .to{text-align:right;justify-content:flex-end}
  .daynav svg{width:14px;height:14px;flex:none;color:var(--ink-3)}
  .daynav b{font-weight:650;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .daynav .ph{flex:1;border:0;background:none}

  /* ── tickets ─────────────────────────────── */
  .tickets{margin-top:34px}
  .sec{display:flex;align-items:center;gap:8px;margin:0 0 12px}
  .sec h2{font-family:var(--serif);font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em}
  .sec .count{font-size:11px;color:var(--ink-3);letter-spacing:.06em}
  .sec::after{content:"";flex:1;height:1px;background:var(--line);margin-left:4px}

  .tcard{
    position:relative;display:flex;gap:11px;align-items:flex-start;
    padding:13px 14px 13px 16px;margin-bottom:9px;
    border:1px solid var(--line);border-radius:13px;background:var(--card);overflow:hidden;
  }
  .tcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--accent))}
  .ticon{
    flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
    background:var(--ct,rgba(27,26,23,.05));color:var(--c,var(--ink-2));margin-top:1px;
  }
  .ticon svg{width:17px;height:17px}
  .tmain{flex:1;min-width:0}
  .tmain h3{margin:0;font-size:14px;font-weight:650;line-height:1.35;letter-spacing:-.005em;word-break:keep-all}
  .tmain p{margin:2px 0 0;font-size:12px;color:var(--ink-3);word-break:keep-all}
  .tcode{
    display:inline-flex;align-items:center;gap:5px;margin-top:7px;padding:4px 8px;
    border-radius:6px;background:rgba(27,26,23,.055);border:1px solid transparent;
    font-family:var(--mono);font-size:11px;letter-spacing:.07em;color:var(--ink-2);
    transition:background .15s,border-color .15s;
  }
  .tcode:hover{background:rgba(27,26,23,.09);border-color:var(--line-2)}
  .tcode svg{width:11px;height:11px;opacity:.6}
  .tlink{display:inline-flex;align-items:center;gap:4px;margin-left:10px;margin-top:7px;font-size:11.5px;color:var(--accent)}
  .tlink svg{width:12px;height:12px}

  .resblock{border:1px solid var(--line);border-radius:13px;background:var(--card);overflow:hidden}
  .rrow{padding:12px 14px;border-top:1px solid var(--line)}
  .rrow:first-child{border-top:0}
  .rtop{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .rtop b{font-size:13.5px;font-weight:650;letter-spacing:-.005em;word-break:keep-all}
  .rline{margin:3px 0 0;font-size:12px;color:var(--ink-3);word-break:keep-all}
  .rcode{display:inline-block;margin-top:5px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-2)}
  .rphone{display:inline-block;margin-left:8px;margin-top:5px;font-size:11.5px;color:var(--accent)}

  .tripnote{margin:20px 2px 0;font-size:11.5px;color:var(--ink-3);font-style:italic;line-height:1.6;word-break:keep-all}

  /* ── foot ────────────────────────────────── */
  .foot{margin-top:34px;padding-top:13px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3)}
  .foot .frow{display:flex;align-items:center;gap:10px}
  .foot .fbtm{margin-left:auto;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2);font-size:11px;color:var(--ink-3)}
  .foot .fnote{margin:8px 0 0;line-height:1.6;max-width:52ch}

  /* ── feedback pill ───────────────────────── */
  .fb{
    position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);
    z-index:60;display:flex;align-items:center;gap:2px;padding:5px 6px 5px 15px;
    border-radius:999px;background:rgba(27,26,23,.94);color:var(--paper-2);
    box-shadow:0 10px 28px rgba(27,26,23,.22);backdrop-filter:blur(8px);
    animation:fbIn .24s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes fbIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
  .fb .cnt{font-size:12px;margin-right:7px;white-space:nowrap;letter-spacing:.01em}
  .fb .cnt b{color:#F0B195;font-weight:650}

      if (d.date) o.date = d.date;
      if (d.weekday) o.weekday = d.weekday;
      if (d.headline) o.headline = d.headline;

  /* ── Supabase REST (짧은 링크 · 동행자 반응) ─────────────── */
  function sbRequest(path, opts){

    var timer = null;
    if (ctl) {

      timer = setTimeout(function(){ ctl.abort(); }, 12000);
    }
    return fetch(SUPABASE_URL + "/rest/v1/" + path, init).then(function(res){
      if (timer) clearTimeout(timer);
      return res.text().then(function(txt){
        var data = null;
        if (txt) { try { data = JSON.parse(txt); } catch (e) { data = txt; } }
        if (!res.ok) {

          var err = new Error(msg);

    });

      setReactHint(true);
      if (!same) renderDay(state.trip);
    } catch (e) {
      if (state.tripKey !== key) return;
      state.reactionsError = (e && e.message) ? e.message : "알 수 없는 오류";
      setReactHint(false, state.reactionsError);
    }
  }

  /* 내 좋아요·메모를 서버에 반영 — 테이블은 INSERT만 허용되므로 행을 고치지 않고 새 행을 더합니다.
     (INSERT 외의 요청은 RLS에서 조용히 무시되어 반영되지 않으므로 시도하지 않습니다.) */
  async function pushReaction(itemId){
    if (!state.tripKey) return;
    var key = state.tripKey;
    var fb = tripFeedback()[itemId] || {};
    var author = currentNick();
    var liked = !!fb.like;
    var memo = String(fb.memo || "").trim();

    if (!liked && !memo && !hasServerReaction(itemId, author)) return; /* 거둘 것이 없음 */

    try {
      await sbRequest("trip_reactions", {
        method: "POST",
        body: { trip_id: key, item_id: itemId, author: author, liked: liked, memo: memo },
        prefer: "return=minimal"
      });
      if (state.tripKey !== key) return;
      await loadReactions(true);
    } catch (e) {
      if (state.tripKey !== key) return;
      toast("서버에 저장하지 못했어요");
      setReactHint(false, (e && e.message) || "네트워크");
    }
  }

  var pollTimer = null;
  function stopPoll(){
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }
  function startPoll(){
    stopPoll();
    pollTimer = setInterval(function(){
      if (document.hidden || !state.tripKey) return;
      var ae = document.activeElement;
      if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA")) return;
      if (document.querySelector(".memoedit:not([hidden])")) return;
      loadReactions(true);
    }, 20000);
  }

  /* ── 렌더 ─────────────────────────────────────────────────── */
  function renderMeta(trip){
    $("kicker").textContent = (state.source === "sample" ? "샘플 · " : "") + (trip.place || "TRIP");
    $("tripTitle").textContent = trip.title;
    document.title = trip.title + " · XO Trip";

    var meta = $("tripMeta");
    clear(meta);
    var range = trip.dateRange || (trip.days.length ? trip.days.length + "일 일정" : "");
    if (range) meta.appendChild(h("span", { class: "mi" }, svg("calendar"), h("span", { text: range })));

    var stay = $("tripStay");
    clear(stay);
    if (trip.stay) {
      stay.appendChild(svg("bed"));
      stay.appendChild(h("span", { text: trip.stay }));
      stay.hidden = false;
    } else stay.hidden = true;

    var count = 0;
    trip.days.forEach(function(d){ count += d.items.length; });
    var stats = $("tripStats");
    clear(stats);
    if (count) {
      stats.appendChild(h("span", { class: "schip" }, "일정", h("b", { text: String(count) })));
      stats.appendChild(h("span", { class: "schip" }, "Day", h("b", { text: trip.days.length > 1 ? "1–" + trip.days.length : "1" })));
      var tk = trip.tickets.filter(function(t){ return t.type === "flight"; }).length;
      if (tk) stats.appendChild(h("span", { class: "schip" }, "항공", h("b", { text: String(tk) })));
      stats.hidden = false;
    } else stats.hidden = true;
  }

  function renderTabs(trip){
    var nav = $("dayTabs");
    clear(nav);
    if (trip.days.length < 2) { nav.hidden = true; return; }
    nav.hidden = false;
    trip.days.forEach(function(d){
      var label = [d.date, d.weekday ? "(" + d.weekday + ")" : ""].join("").trim();
      if (!label) label = d.items.length + "곳";
      var btn = h("button", {
        class: "daytab",
        type: "button",
        role: "tab",
        id: "tab-" + d.index,
        "aria-selected": String(d.index === state.activeDay),
        "aria-controls": "schedule",
        tabindex: d.index === state.activeDay ? "0" : "-1",
        onclick: function(){ selectDay(d.index, true); }
      },
        h("b", { text: "Day " + d.index }),
        h("span", { text: label }),
        h("em", { class: "dv num", text: String(d.items.length) })
      );
      nav.appendChild(btn);
    });
  }

  function selectDay(index, scroll){
    state.activeDay = index;
    renderTabs(state.trip);
    renderDay(state.trip);
    if (scroll) {
      var y = $("schedule").getBoundingClientRect().top + window.pageYOffset;
      if (window.pageYOffset > y - 90) window.scrollTo({ top: y - 78, behavior: "smooth" });
    }
  }

  function renderDay(trip){
    var main = $("schedule");
    clear(main);
    var day = trip.days.filter(function(d){ return d.index === state.activeDay; })[0] || trip.days[0];
    if (!day) {
      main.appendChild(h("p", { class: "skeleton", text: "이 링크에는 일정이 없습니다.", style: "padding:34px 2px;color:var(--ink-3);font-size:13px" }));
      return;
    }

    var when = [day.date, day.weekday ? "(" + day.weekday + ")" : ""].filter(Boolean).join(" ");
    var headline = day.headline || (when ? "" : "Day " + day.index);
    main.appendChild(h("div", { class: "dayhead" },
      h("div", { class: "dnum" }, h("span", { text: "Day" }), h("b", { text: String(day.index) })),
      h("div", { class: "dinfo" },
        headline ? h("h2", { text: headline }) : null,
        h("p", { text: [when, day.items.length + "곳"].filter(Boolean).join(" · ") })
      )
    ));
    if (day.summary) main.appendChild(h("p", { class: "daysummary", text: day.summary }));

    var ol = h("ol", { class: "timeline" });
    var map = reactionsByItem();
    day.items.forEach(function(it){ ol.appendChild(itemRow(trip, it, peerData(it.id, map))); });
    main.appendChild(ol);

    if (trip.days.length > 1) {
      var pos = trip.days.indexOf(day);
      var prev = trip.days[pos - 1], next = trip.days[pos + 1];
      var nav = h("div", { class: "daynav" });
      if (prev) {
        nav.appendChild(h("button", { type: "button", onclick: function(){ selectDay(prev.index, true); } },
          svg("chevL"), h("b", { text: "Day " + prev.index }), h("span", { text: prev.date || "" })));
      } else nav.appendChild(h("span", { class: "ph" }));
      if (next) {
        nav.appendChild(h("button", { type: "button", class: "to", onclick: function(){ selectDay(next.index, true); } },
          h("span", { text: next.date || "" }), h("b", { text: "Day " + next.index }), svg("chevR")));
      }
      main.appendChild(nav);
    }
  }

  function itemRow(trip, it, peers){
    var fb = tripFeedback()[it.id] || {};
    var me = currentNick();
    var st = catStyle(it.cat);
    var style = "--c:" + st.c + ";--ct:" + hexRgba(st.c, .1);
    var mine = !!fb.like;
    var myMemo = String(fb.memo || "").trim();

    var badges = h("span", { class: "badges" });
    if (it.together) badges.appendChild(h("span", { class: "badge together", text: "함께" }));
    if (it.status && it.statusTone !== "none") badges.appendChild(h("span", { class: "badge " + it.statusTone, text: it.status }));

    var card = h("article", { class: "card" },
      h("div", { class: "crow" },
        h("span", { class: "tag", style: style }, svg(st.i), h("span", { text: catLabel(trip, it.cat) })),
        badges
      ),
      h("h3", { class: "title", text: it.title })
    );

    if (it.route) {
      card.appendChild(h("p", { class: "meta" }, svg("route"), h("span", { class: "mtxt", text: it.route })));
    }

    if (it.memo) {
      var note = h("div", { class: "note" }, h("span", { class: "txt", text: it.memo }));
      if (it.memo.length > 26) {
        var nb = h("button", { class: "notemore", type: "button", "aria-expanded": "false", "aria-label": "메모 더 보기", title: "더 보기" }, svg("chev"));
        nb.addEventListener("click", function(){
          var open = note.classList.toggle("open");
          nb.setAttribute("aria-expanded", open ? "true" : "false");
        });
        note.appendChild(nb);
      }
      card.appendChild(note);
    }

    var likeBtn = h("button", {
      class: "pill like" + (mine ? " on" : ""),
      type: "button",
      "aria-pressed": mine ? "true" : "false",
      "aria-label": "좋아요" + (peers.likes.length ? " " + peers.likes.length + "명" : "") + " · " + (mine ? "누르면 취소" : "눌러서 표시"),
      title: peers.likes.length ? peers.likes.join(", ") : "좋아요"
    },
      h("span", { class: "emo", "aria-hidden": "true", text: "👍" }),
      peers.likes.length ? h("span", { class: "n num", text: String(peers.likes.length) }) : null
    );
    likeBtn.addEventListener("click", function(){ toggleLike(it.id); });

    var memoBtn = h("button", {
      class: "pill memo" + (myMemo ? " on" : ""),
      type: "button",
      "aria-label": "한 줄 메모" + (peers.memos.length ? " " + peers.memos.length + "개" : ""),
      title: "한 줄 메모"
    },
      svg("chat"),
      peers.memos.length ? h("span", { class: "n num", text: String(peers.memos.length) }) : null
    );
    memoBtn.addEventListener("click", function(){ toggleMemoEditor(row); });

    var acts = h("div", { class: "acts" }, likeBtn, memoBtn);
    var m = money(trip, it.cost);
    if (m) acts.appendChild(h("span", { class: "cost num", text: m.text + (m.unit ? " " + m.unit : "") }));

    var mapHref = mapUrl(it, trip);
    if (mapHref) {
      acts.appendChild(h("a", { class: "mapbtn", href: mapHref, target: "_blank", rel: "noopener noreferrer", "aria-label": it.title + " 지도에서 열기", title: "지도" }, svg("pin")));
    }
    card.appendChild(acts);

    if (peers.memos.length) {
      var box = h("div", { class: "peers" });
      peers.memos.forEach(function(mm){
        var self = mm.who === me;
        box.appendChild(h("div", { class: "pm" + (self ? " self" : "") },
          h("span", { class: "pav", text: initial(mm.who) }),
          h("div", { class: "ptxt" }, h("b", { text: self ? "나" : mm.who }), h("span", { text: mm.text }))
        ));
      });
      card.appendChild(box);
    }

    var input = h("input", {
      type: "text", maxlength: "80", placeholder: "한 줄 메모", value: fb.memo || "",
      "aria-label": it.title + " 한 줄 메모"
    });
    input.addEventListener("keydown", function(ev){
      if (ev.key === "Enter") { ev.preventDefault(); setMemo(it.id, input.value); }
    });
    card.appendChild(h("div", { class: "memoedit", hidden: true },
      input,
      h("button", { class: "send", type: "button", "aria-label": "메모 저장", onclick: function(){ setMemo(it.id, input.value); } }, svg("send"))
    ));

    var row = h("li", { class: "stop", dataset: { itemId: it.id }, style: style },
      h("div", { class: "rail" }, h("span", { class: "t num" + (it.time ? "" : " muted"), text: it.time || "—" }), h("span", { class: "dot" })),
      card
    );
    return row;
  }

  function findItem(itemId){
    var found = null;
    if (!state.trip) return null;
    state.trip.days.forEach(function(d){
      d.items.forEach(function(it){ if (it.id === itemId) found = it; });
    });
    return found;
  }

  /* 그 카드만 다시 그려 좋아요 수·메모 수를 즉시 맞춥니다. */
  function rerenderItem(itemId){
    var it = findItem(itemId);
    if (!it) return;
    var rows = document.querySelectorAll(".stop");
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].dataset.itemId === itemId) {
        var fresh = itemRow(state.trip, it, peerData(itemId));
        rows[i].parentNode.replaceChild(fresh, rows[i]);
        return;
      }
    }
  }

  function toggleMemoEditor(row){
    var ed = row.querySelector(".memoedit");
    if (!ed) return;
    ed.hidden = !ed.hidden;
    if (!ed.hidden) {
      var input = ed.querySelector("input");
      if (input) input.focus();
    }
  }

  function toggleLike(itemId){
    var fb = tripFeedback();
    var entry = fb[itemId] || {};
    entry.like = !entry.like;
    if (!entry.like && !(entry.memo && entry.memo.trim())) delete fb[itemId];
    else fb[itemId] = entry;
    saveStore(state.feedback);
    rerenderItem(itemId);
    updateFeedbackBar();
    pushReaction(itemId);
  }

  function setMemo(itemId, text){
    var fb = tripFeedback();
    var entry = fb[itemId] || {};
    var v = (text || "").trim();
    if (v) entry.memo = v; else delete entry.memo;
    if (!entry.like && !entry.memo) delete fb[itemId];
    else fb[itemId] = entry;
    saveStore(state.feedback);
    rerenderItem(itemId);
    updateFeedbackBar();
    pushReaction(itemId);
    toast(v ? "메모를 남겼어요" : "메모를 지웠어요");
  }

  function updateFeedbackBar(){
    var bar = $("feedbackBar"), n = feedbackCount();
    var c = $("fbCount");
    clear(c);
    c.appendChild(document.createTextNode("내 반응 "));
    c.appendChild(h("b", { text: String(n) }));
    bar.hidden = n === 0;
  }

  function renderTickets(trip){
    var block = $("ticketsBlock"), body = $("ticketsBody");
    clear(body);
    var flights = trip.tickets.filter(function(t){ return t.type === "flight"; });
    var others = trip.tickets.filter(function(t){ return t.type !== "flight"; });
    var res = trip.reservations;
    var total = flights.length + others.length + res.length;
    if (!total) { block.hidden = true; return; }
    block.hidden = false;
    $("ticketsCount").textContent = total + "건";

    flights.concat(others).forEach(function(t){
      var isF = t.type === "flight";
      var col = isF ? "#2E6E8E" : "#6B6257";
      var card = h("div", { class: "tcard", style: "--c:" + col + ";--ct:" + hexRgba(col, .1) },
        h("span", { class: "ticon" }, svg(isF ? "plane" : "ticket"))
      );
      var main = h("div", { class: "tmain" }, h("h3", { text: t.title }));
      var sub = [t.subtitle, t.note].filter(Boolean).join(" · ");
      if (sub) main.appendChild(h("p", { text: sub }));
      if (t.code) {
        var codeBtn = h("button", { class: "tcode", type: "button", title: "예약번호 복사" },
          h("span", { text: t.code }), svg("copy"));
        codeBtn.addEventListener("click", async function(){
          var ok = await copyText(t.code);
          toast(ok ? "예약번호를 복사했어요" : "복사하지 못했어요");
        });
        main.appendChild(codeBtn);
      }
      if (t.url && /^https?:\/\//i.test(t.url)) {
        main.appendChild(h("a", { class: "tlink", href: t.url, target: "_blank", rel: "noopener noreferrer" }, svg("link"), h("span", { text: "예약 페이지" })));
      }
      card.appendChild(main);
      body.appendChild(card);
    });

    if (res.length) {
      var wrap = h("div", { class: "resblock" });
      res.forEach(function(r){
        var item = h("div", { class: "rrow" },
          h("div", { class: "rtop" },
            h("b", { text: r.title }),
            r.badge ? h("span", { class: "badge " + (r.tone || "info"), text: r.badge }) : null
          )
        );
        if (r.lines.length) item.appendChild(h("p", { class: "rline", text: r.lines.join(" · ") }));
        if (r.code) item.appendChild(h("span", { class: "rcode", text: r.code }));
        if (r.phone) {
          item.appendChild(h("a", { class: "rphone", href: "tel:" + r.phone.replace(/[^+0-9]/g, ""), text: r.phone }));
        }
        wrap.appendChild(item);
      });
      body.appendChild(wrap);
    }
  }

  function render(trip, source, opts){
    opts = opts || {};
    state.trip = trip;
    state.source = source;
    state.shortId = opts.shortId || null;
    state.tripKey = (source === "sample") ? null : (state.shortId || trip.id || null);
    state.reactions = [];
    state.reactionsError = "";
    state.activeDay = trip.days.length ? trip.days[0].index : null;
    state.feedback = loadStore();

    $("nickRow").hidden = !state.tripKey;
    setReactHint(true);
    var av = $("nickAv");
    av.textContent = initial(currentNick());

    renderMeta(trip);
    renderTabs(trip);
    renderDay(trip);
    renderTickets(trip);
    updateFeedbackBar();

    var note = $("tripNote");
    if (trip.note) { note.textContent = trip.note; note.hidden = false; } else note.hidden = true;

    $("sampleNotice").hidden = (source !== "sample");
    var sb = $("shareBtn");
    sb.hidden = !(navigator.share);
    clear(sb);
    sb.appendChild(svg("share"));
    window.scrollTo({ top: 0, behavior: "auto" });

    if (state.tripKey) { loadReactions(true); startPoll(); }
    else stopPoll();
  }

  /* ── 의견 복사 ────────────────────────────────────────────── */
  function buildFeedbackText(){
    var trip = state.trip, fb = tripFeedback();
    var lines = [];
    trip.days.forEach(function(d){
      d.items.forEach(function(it){
        var e = fb[it.id];
        if (!e) return;
        var mark = e.like ? "👍" : "·";
        var memo = e.memo ? ' — "' + e.memo + '"' : "";
        lines.push(mark + " D" + d.index + " " + (it.time || "") + " " + it.title + memo);
      });
    });
    if (!lines.length) return "";
    var head = "[" + trip.title + "] 함께 보는 일정에 의견 남겼어요.";
    return head + "\n" + lines.join("\n") + "\n— XO Trip 공유 뷰어";
  }

  /* ── 클립보드 ─────────────────────────────────────────────── */
  async function copyText(text){
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) { /* 아래 폴백 */ }
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  var toastTimer = null;
  function toast(msg){
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  /* ── 링크 만들기 패널 ─────────────────────────────────────── */
  function setComposer(open){
    var panel = $("composer");
    panel.hidden = !open;
    $("toggleComposer").setAttribute("aria-expanded", open ? "true" : "false");
    document.body.classList.toggle("sheet-open", open);
    if (open) {
      setTimeout(function(){ if (!$("jsonInput").value) $("jsonInput").focus(); }, 70);
    } else {
      $("toggleComposer").focus();
    }
  }

  function status(msg, kind){
    var s = $("composerStatus");
    s.textContent = msg || "";
    s.className = "status" + (kind ? " " + kind : "");
  }

  function parsePasted(text){
    var t = (text || "").trim();
    if (!t) throw new Error("붙여넣은 내용이 없습니다.");
    /* 코드펜스나 앞뒤 설명이 섞여도 첫 { … } 덩어리를 잡아 봅니다. */
    try { return JSON.parse(t); } catch (e) { /* 아래에서 다시 시도 */ }
    var start = t.indexOf("{"), end = t.lastIndexOf("}");
    if (start >= 0 && end > start) {
      try { return JSON.parse(t.slice(start, end + 1)); } catch (e2) { /* 실패 */ }
    }
    throw new Error("JSON을 읽지 못했습니다. XO Trip의 JSON 전문을 붙여넣어 주세요.");
  }

  async function buildLink(){
    var btn = $("buildLink");
    btn.disabled = true;
    status("링크를 만드는 중…");
    try {
      var doc = parsePasted($("jsonInput").value);
      var trip = normalize(doc);
      var payload = await encodeTrip(slimDoc(trip));
      var url = shareBase() + "#d=" + payload;
      $("shareUrl").value = url;
      $("linkBox").hidden = false;

      var packed = payload.charAt(0) === "z";
      var count = 0;
      trip.days.forEach(function(d){ count += d.items.length; });
      $("linkMeta").textContent = "일정 " + count + "건 · " + trip.days.length + "일 · 링크 " +
        new Intl.NumberFormat("ko-KR").format(url.length) + "자 (" + (packed ? "압축" : "평문") + ")" +
        (url.length > 2000 ? " · 길어서 일부 앱에서 잘릴 수 있어요" : "");
      status("링크를 만들었어요.", "good");
      render(trip, "paste");
      $("linkBox").scrollIntoView({ block: "nearest" });
      $("copyLink").focus({ preventScroll: true });
    } catch (err) {
      $("linkBox").hidden = true;
      status(err && err.message ? err.message : "링크를 만들지 못했습니다.", "bad");
    } finally {
      btn.disabled = false;
    }
  }

  function renderSample(){
    var trip = normalize(SAMPLE);
    render(trip, "sample");
  }

  /* ── 짧은 링크 만들기 (?id=) ────────────────────────────── */
  async function createShortLink(){
    var btn = $("makeShort");
    btn.disabled = true;
    status("짧은 링크를 만드는 중…");
    var trip = null;
    try {
      var doc = parsePasted($("jsonInput").value);
      trip = normalize(doc);
      var id = null;
      for (var attempt = 0; attempt < 3 && !id; attempt++) {
        var cand = randomShortId();
        try {
          await sbRequest("shared_trips", {
            method: "POST",
            body: { id: cand, title: trip.title, payload: slimDoc(trip) },
            prefer: "return=minimal"
          });
          id = cand;
        } catch (e) {
          if (e.status === 409) continue; /* 주소가 겹치면 다시 */
          throw e;
        }
      }
      if (!id) throw new Error("주소를 겹치지 않게 만들지 못했습니다. 다시 시도해 주세요.");

      var url = CANONICAL_BASE + "?id=" + id;
      $("shareUrl").value = url;
      $("linkBox").hidden = false;
      var count = 0;
      trip.days.forEach(function(d){ count += d.items.length; });
      $("linkMeta").textContent = "일정 " + count + "건 · " + trip.days.length + "일 · " + url.length + "자";
      status("짧은 링크를 만들었어요.", "good");
      render(trip, "paste", { shortId: id });
      $("linkBox").scrollIntoView({ block: "nearest" });
      $("copyLink").focus({ preventScroll: true });
    } catch (err) {
      var msg = (err && err.message) ? err.message : "알 수 없는 오류";
      if (!trip) { status(msg, "bad"); return; }
      try {
        var fallback = await encodeTrip(slimDoc(trip));
        $("shareUrl").value = shareBase() + "#d=" + fallback;
        $("linkBox").hidden = false;
        $("linkMeta").textContent = "짧은 링크 대신 오프라인 #d= 링크를 만들었어요.";
        status("짧은 링크를 만들지 못했습니다 — #d= 링크로 대신했어요.", "bad");
        render(trip, "paste");
      } catch (e2) {
        $("linkBox").hidden = true;
        status(msg, "bad");
      }
    } finally {
      btn.disabled = false;
    }
  }

  /* ── 이벤트 연결 ─────────────────────────────────────────── */
  $("toggleComposer").appendChild(svg("plus"));
  $("closeComposer").appendChild(svg("close"));
  $("copyFeedback").appendChild(svg("copy"));
  $("clearFeedback").appendChild(svg("trash"));

  $("toggleComposer").addEventListener("click", function(){
    setComposer($("composer").hidden);
  });
  $("closeComposer").addEventListener("click", function(){ setComposer(false); });
  $("composerScrim").addEventListener("click", function(){ setComposer(false); });
  document.addEventListener("keydown", function(ev){
    if (ev.key === "Escape" && !$("composer").hidden) setComposer(false);
  });
  $("noticeCompose").addEventListener("click", function(){ setComposer(true); });
  $("buildLink").addEventListener("click", buildLink);
  $("makeShort").addEventListener("click", createShortLink);
  $("clearJson").addEventListener("click", function(){
    $("jsonInput").value = "";
    $("linkBox").hidden = true;
    status("");
    $("jsonInput").focus();
  });
  $("fileInput").addEventListener("change", function(ev){
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      $("jsonInput").value = String(reader.result || "");
      status(f.name + " 읽었어요. [짧은 링크 만들기]를 누르세요.");
    };
    reader.onerror = function(){ status("파일을 읽지 못했습니다.", "bad"); };
    reader.readAsText(f, "utf-8");
    ev.target.value = "";
  });
  $("copyLink").addEventListener("click", async function(){
    var url = $("shareUrl").value;
    if (!url) return;
    var ok = await copyText(url);
    toast(ok ? "링크를 복사했어요" : "복사하지 못했어요. 길게 눌러 복사해 주세요");
  });
  $("previewLink").addEventListener("click", function(){
    var url = $("shareUrl").value;
    if (!url) return;
    location.href = url;
  });
  $("copyJsonPreview").addEventListener("click", async function(){
    if (!state.trip) return;
    var ok = await copyText(JSON.stringify(state.trip.raw, null, 2));
    toast(ok ? "JSON을 복사했어요" : "복사하지 못했어요");
  });
  $("shareBtn").addEventListener("click", async function(){
    if (!navigator.share) return;
    var url = location.href;
    try {
      await navigator.share({ title: state.trip ? state.trip.title : "XO Trip", text: "여행 일정 공유", url: url });
    } catch (e) { /* 사용자가 취소 */ }
  });
  $("copyFeedback").addEventListener("click", async function(){
    var text = buildFeedbackText();
    if (!text) { toast("아직 남긴 의견이 없어요"); return; }
    var ok = await copyText(text);
    toast(ok ? "의견을 복사했어요" : "복사하지 못했어요");
  });
  $("clearFeedback").addEventListener("click", function(){
    if (!window.confirm("이 기기에 남긴 좋아요·메모를 지울까요? 함께 보는 사람 화면에서도 빠집니다.")) return;
    var id = state.trip ? state.trip.id : "sample";
    var had = Object.keys(state.feedback[id] || {});
    delete state.feedback[id];
    saveStore(state.feedback);
    renderDay(state.trip);
    updateFeedbackBar();
    if (state.tripKey) had.forEach(function(itemId){ pushReaction(itemId); });
    toast("의견을 지웠어요");
  });
  $("footInfo").addEventListener("click", function(){
    var note = $("footNote");
    note.hidden = !note.hidden;
    $("footInfo").setAttribute("aria-expanded", note.hidden ? "false" : "true");
  });
  window.addEventListener("hashchange", function(){ boot(); });

  var topbar = $("topbar");
  window.addEventListener("scroll", function(){
    topbar.classList.toggle("scrolled", window.pageYOffset > 4);
  }, { passive: true });

  document.addEventListener("visibilitychange", function(){
    if (!document.hidden && state.tripKey) loadReactions(true);
  });

  var nickEl = $("nickInput");
  nickEl.addEventListener("input", function(){
    try { localStorage.setItem(NICK_KEY, nickEl.value); } catch (e) { /* 저장 불가 */ }
    $("nickAv").textContent = initial(nickEl.value || "동");
  });

  $("dayTabs").addEventListener("keydown", function(ev){
    if (ev.key !== "ArrowRight" && ev.key !== "ArrowLeft") return;
    var tabs = Array.prototype.slice.call(document.querySelectorAll(".daytab"));
    var i = tabs.indexOf(document.activeElement);
    if (i < 0) return;
    ev.preventDefault();
    var next = tabs[ev.key === "ArrowRight" ? i + 1 : i - 1];
    if (next) next.focus();
  });

  /* ── 시작 ─────────────────────────────────────────────────── */
  async function boot(){
    var errBox = $("errorNotice"), errText = $("errorText");
    errBox.hidden = true;
    stopPoll();

    /* 닉네임 불러오기 (기본: 동행자) */
    try { nickEl.value = localStorage.getItem(NICK_KEY) || ""; } catch (e) { nickEl.value = ""; }
    $("nickAv").textContent = initial(nickEl.value || "동");

    var shortParam = "";
    try { shortParam = (new URLSearchParams(location.search).get("id") || "").trim(); } catch (e) { shortParam = ""; }
    var payload = readHashPayload();

    if (shortParam) {
      $("schedule").innerHTML = "";
      $("schedule").appendChild(h("div", { class: "sk sk-head" }));
      $("schedule").appendChild(h("div", { class: "sk sk-card" }));
      try {
        var rows = await sbRequest("shared_trips?id=eq." + encodeURIComponent(shortParam) + "&select=id,title,payload");
        var row = (rows && rows[0]) || null;
        if (!row || !row.payload) throw new Error("이 짧은 링크의 일정을 찾지 못했습니다.");
        var shortTrip = normalize(row.payload);
        render(shortTrip, "short", { shortId: shortParam });
        return;
      } catch (err) {
        if (!payload) {
          errText.textContent = "짧은 링크를 열지 못했습니다 — " + (err && err.message ? err.message : "알 수 없는 오류");
          errBox.hidden = false;
          renderSample();
          return;
        }
        /* 주소에 #d= 도 함께 있으면 그쪽으로 넘어갑니다. */
      }
    }

    if (!payload) { renderSample(); return; }

    $("schedule").innerHTML = "";
    $("schedule").appendChild(h("div", { class: "sk sk-head" }));
    $("schedule").appendChild(h("div", { class: "sk sk-card" }));
    try {
      var doc = await decodeTrip(payload);
      var trip = normalize(doc);
      render(trip, "link");
    } catch (err) {
      errText.textContent = "공유 링크를 열지 못했습니다 — " + (err && err.message ? err.message : "알 수 없는 오류");
      errBox.hidden = false;
      renderSample();
    }
  }

  boot();
})();
</script>
</body>
</html>
